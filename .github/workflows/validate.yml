name: Validate Skill

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate package structure
        run: python scripts/validate_skill.py .
      - name: Compile helper scripts
        run: python -m py_compile scripts/validate_skill.py scripts/init_project.py scripts/package_release.py
      - name: Build release archive
        run: python scripts/package_release.py . --output-dir dist
